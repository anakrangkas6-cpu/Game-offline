name: Bella Virtual Life Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Ubah ke false jika repo tidak menggunakan Git LFS

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library # Jika pakai subfolder, ubah jadi NamaFolder/Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          # projectPath: NamaFolderProject # <-- Hapus tanda '#' di depan dan isi jika folder Assets/ProjectSettings ada di dalam subfolder
          buildName: BellaVirtualLife
          buildsPath: build
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BellaVirtualLife-Android
          path: build/Android/*.apk
          if-no-files-found: error
